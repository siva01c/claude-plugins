# Custom Semgrep rule for Drupal *.routing.yml files.
#
# A route is recognised by having both `path` and `defaults`, so other YAML
# (services, config, info files) is not reported. `metadata.asvs` uses the
# requirement IDs of the security-tools `owasp-asvs` skill.
#
# Tests: rules/drupal-routing.test.yaml holds `ruleid:` / `ok:` fixtures.
#   semgrep --test rules/

rules:
  - id: drupal-route-without-access-check
    languages: [yaml]
    severity: WARNING
    message: >-
      Route $ROUTE has no access requirement. Add `_permission`,
      `_custom_access`, `_entity_access`, `_role` or `_user_is_logged_in`
      under `requirements:`; a route that is meant to be public says so with
      `_access: 'TRUE'`.
    metadata:
      category: security
      asvs: ["V8.1.3", "V4.2.1"]
      cwe: ["CWE-862: Missing Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      triage: >-
        True positive for a route without `requirements:` (Drupal denies it,
        but the intent is missing) and for a route whose requirements hold
        only `_csrf_token`, `_format`, `_method` or parameter patterns. False
        positive when a contrib access check is used (a custom `_*_access`
        key provided by another module): check its access_check service.
      references:
        - https://www.drupal.org/docs/drupal-apis/routing-system/access-checking-on-routes
    patterns:
      - pattern: |
          $ROUTE:
            ...
            path: $PATH
            ...
            defaults: $DEFAULTS
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _permission: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _access: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _custom_access: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _entity_access: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _entity_create_access: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _entity_create_any_access: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _role: $ACCESS
              ...
            ...
      - pattern-not-inside: |
          $ROUTE:
            ...
            requirements:
              ...
              _user_is_logged_in: $ACCESS
              ...
            ...
